<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Latar gelap ala code editor -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <!-- Gradien brand: biru ke mint (sesuai warna primary dan accent) -->
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#38a8f0"/>
      <stop offset="100%" stop-color="#2ec4a0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#2ec4a0" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>

  <!-- Simbol kode </> -->
  <g fill="none" stroke="url(#code)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="21,20 10,32 21,44"/>
    <polyline points="43,20 54,32 43,44"/>
    <line x1="36.5" y1="15" x2="27.5" y2="49"/>
  </g>

  <!-- Kursor terminal berkedip -->
  <rect x="44" y="49" width="9" height="4" rx="1.5" fill="#2ec4a0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
